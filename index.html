<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>광물 판매 타이쿤</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- 캡처를 위한 html2canvas 라이브러리 추가 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useCallback } = React;

    // 1. 교과서 핵심 광물 데이터베이스 (총 6종으로 통합)
    const MINERALS = [
      { id: '석영', name: '석영', color: '🌟 밝은색(무색/흰색)입니다!', streak: '흰색 가루가 나옵니다. (특징 없음)', hardness: '⚔️ 매우 단단합니다! 방해석을 긁어버립니다.', hcl: '반응이 없습니다.', magnetism: '반응이 없습니다.' },
      { id: '장석', name: '장석', color: '🌟 밝은색(흰색/분홍색)입니다!', streak: '흰색 가루가 나옵니다.', hardness: '단단한 편이지만 석영보다는 약간 무릅니다.', hcl: '반응이 없습니다.', magnetism: '반응이 없습니다.' },
      { id: '방해석', name: '방해석', color: '🌟 밝은색(무색/흰색)입니다!', streak: '흰색 가루가 나옵니다.', hardness: '⚔️ 무른 편입니다. 석영과 긁으면 방해석이 긁힙니다.', hcl: '🫧 거품이 보글보글 발생합니다! (염산 반응 O)', magnetism: '반응이 없습니다.' },
      { id: '흑운모류', name: '흑운모(각·휘·감)', color: '🌑 어두운색입니다! (흑·각·휘·감 4총사)', streak: '😲 흰색(또는 옅은 녹색) 가루가 나옵니다!', hardness: '흑운모는 얇게 벗겨지고, 나머지는 단단한 편입니다.', hcl: '반응이 없습니다.', magnetism: '반응이 없습니다.' },
      { id: '자철석', name: '자철석', color: '🌑 어두운색(검은색)입니다!', streak: '🖤 검은색 가루가 나옵니다!', hardness: '단단한 편입니다.', hcl: '반응이 없습니다.', magnetism: '🧲 쇠붙이를 강하게 끌어당깁니다! (자성 O)' },
      { id: '적철석', name: '적철석', color: '🌑 어두운색(검은색/적갈색)입니다!', streak: '🧱 적갈색(갈색) 가루가 나옵니다!', hardness: '단단한 편입니다.', hcl: '반응이 없습니다.', magnetism: '반응이 없습니다.' }
    ];

    const ALL_MINERAL_NAMES = MINERALS.map(m => m.name);

    // 2. 퀘스트 (총 11개)
    const QUESTS = [
      { id: 'q_jangseok', type: 'single', target: ['장석'], dialogue: '광물학자: "석영과 장석은 밝은색을 띠는 조암광물이지. 분홍색이나 흰색을 띠는 이 광물은 무엇일까?"', mineralId: '장석' },
      { id: 'q_banghae', type: 'single', target: ['방해석'], dialogue: '과학 선생님: "이 흰색 광물에 묽은 염산을 떨어뜨리면 거품이 보글보글 발생한단다. 이런 염산 반응을 하는 광물이 뭐였지?"', mineralId: '방해석' },
      { id: 'q_seogyeong_hard', type: 'single', target: ['석영'], dialogue: '연구원: "이 밝은색 광물이 석영인지 방해석인지 헷갈리네... 긁어서 단단한 정도를 비교해보자! 먼저 [🔨 굳기] 도구를 클릭해서 확인해줘!"', mineralId: '석영', requiredTool: 'hardness' },
      
      // 어두운 조암광물 통합
      { id: 'q_dark_any', type: 'single', target: ['흑운모(각·휘·감)'], dialogue: '수집가: "어두운색을 띠는 조암광물 4총사(흑운모, 각섬석, 휘석, 감람석) 중 아무거나 하나 찾아주게! 굳이 서로 구분할 필요는 없다네!"', mineralId: '흑운모류' },
      
      // 조흔색 3종 비교
      { id: 'q_streak_black', type: 'single', target: ['자철석'], dialogue: '광부: "자철석, 흑운모, 적철석 3가지를 비교하고 있어! 그중에서 조흔판에 긁었을 때 **검은색** 가루가 나오는 광물을 골라줘!"', mineralId: '자철석' },
      { id: 'q_streak_brown', type: 'single', target: ['적철석'], dialogue: '과학 선생님: "자철석, 흑운모, 적철석의 조흔색 비교 문제란다! 조흔판에 긁었을 때 **갈색(적갈색)** 가루가 나오는 광물은 무엇일까?"', mineralId: '적철석' },
      { id: 'q_streak_white', type: 'single', target: ['흑운모(각·휘·감)'], dialogue: '대장장이: "자철석, 적철석, 흑운모 중 겉보기엔 어두운데 조흔판에 긁었더니 반전으로 **흰색** 가루가 나오는 녀석이 있더군! 그게 뭔가?"', mineralId: '흑운모류' },
      
      { id: 'q_magnetism', type: 'single', target: ['자철석'], dialogue: '대장장이: "이 돌에 클립 같은 쇠붙이를 가져갔더니 자석처럼 찰싹 끌어당기더군! 자성이 있는 이 광물의 이름은 뭔가?"', mineralId: '자철석' },
      
      // 이론 문제
      { id: 'q_all_rock', type: 'multi', target: ['석영', '장석', '흑운모(각·휘·감)'], dialogue: '선생님: "[이론 평가] 암석을 이루는 주된 광물인 \'조암광물\'을 모두 적어 제출해보렴!"' },
      { id: 'q_bright_rock', type: 'multi', target: ['석영', '장석'], dialogue: '선생님: "[이론 평가] 조암광물 중에서 밝은색을 띠는 광물을 모두 적어 제출해보렴!"' },
      { id: 'q_dark_rock', type: 'multi', target: ['흑운모(각·휘·감)'], dialogue: '선생님: "[이론 평가] 조암광물 중에서 어두운색을 띠는 광물을 모두 적어 제출해보렴!"' }
    ];

    const TOOLS = [
      { id: 'color', name: '🎨 겉보기 색', desc: '밝기/색상 확인' },
      { id: 'streak', name: '🖍️ 조흔색', desc: '조흔판에 긁기' },
      { id: 'hardness', name: '🔨 굳기', desc: '석영/방해석과 긁기' },
      { id: 'hcl', name: '🧪 염산 반응', desc: '묽은 염산 떨어뜨리기' },
      { id: 'magnetism', name: '🧲 자성', desc: '쇠붙이(클립) 대보기' },
    ];

    // 화려하게 변경된 상점 아이템
    const SHOP_ITEMS = [
      { id: 'microscope', name: '🔬 최첨단 현미경', price: 2000, desc: '광물을 분자 단위까지 꿰뚫어보는 전설의 장비입니다.' },
      { id: 'showcase', name: '🏆 황금 진열장', price: 5000, desc: '닿는 순간 광물이 빛을 발하는 마법의 진열장입니다.' },
      { id: 'cloak', name: '👑 전설의 감정 망토', price: 10000, desc: '광물계의 정점에 선 자만 두를 수 있는 망토입니다.' }
    ];

    const playSound = (type) => {
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      if (!AudioContext) return;
      try {
        const ctx = new AudioContext();
        const osc = ctx.createOscillator();
        const gainNode = ctx.createGain();
        osc.connect(gainNode);
        gainNode.connect(ctx.destination);

        if (type === 'click') {
          osc.type = 'sine'; osc.frequency.setValueAtTime(600, ctx.currentTime); osc.frequency.exponentialRampToValueAtTime(300, ctx.currentTime + 0.1); gainNode.gain.setValueAtTime(0.3, ctx.currentTime); gainNode.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1); osc.start(ctx.currentTime); osc.stop(ctx.currentTime + 0.1);
        } else if (type === 'success') {
          osc.type = 'triangle'; osc.frequency.setValueAtTime(400, ctx.currentTime); osc.frequency.setValueAtTime(600, ctx.currentTime + 0.1); osc.frequency.setValueAtTime(800, ctx.currentTime + 0.2); gainNode.gain.setValueAtTime(0.3, ctx.currentTime); gainNode.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.4); osc.start(ctx.currentTime); osc.stop(ctx.currentTime + 0.4);
        } else if (type === 'error') {
          osc.type = 'sawtooth'; osc.frequency.setValueAtTime(300, ctx.currentTime); osc.frequency.setValueAtTime(250, ctx.currentTime + 0.2); gainNode.gain.setValueAtTime(0.3, ctx.currentTime); gainNode.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.4); osc.start(ctx.currentTime); osc.stop(ctx.currentTime + 0.4);
        } else if (type === 'start' || type === 'clear') {
          osc.type = 'square'; osc.frequency.setValueAtTime(440, ctx.currentTime); osc.frequency.setValueAtTime(880, ctx.currentTime + 0.2); gainNode.gain.setValueAtTime(0.2, ctx.currentTime); gainNode.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.8); osc.start(ctx.currentTime); osc.stop(ctx.currentTime + 0.8);
        }
      } catch (e) { console.log(e); }
    };

    // 공통 하단 푸터 컴포넌트
    const AppFooter = ({ isDark }) => (
      <footer className={`w-full max-w-4xl mx-auto mt-auto pt-8 pb-4 px-4 text-center ${isDark ? 'text-gray-400' : 'text-gray-500'}`}>
        <p className="font-bold text-sm md:text-base mb-2">
          이 웹앱은 비상 교과서 내용을 학습하기 위해 제작되었습니다.
        </p>
        <div className="flex flex-col md:flex-row justify-center items-center gap-1 md:gap-4 text-xs md:text-sm">
          <span>제작자: 조승재(과학이조선생)</span>
          <span className="hidden md:inline opacity-50">|</span>
          <span>문의: <a href="mailto:chuseonjae@outlook.kr" className="hover:underline">chuseonjae@outlook.kr</a></span>
          <span className="hidden md:inline opacity-50">|</span>
          <span>배포일: 2026.03.10.</span>
        </div>
      </footer>
    );

    function App() {
      const [isPlaying, setIsPlaying] = useState(false);
      const [showStory, setShowStory] = useState(true);
      const [playerName, setPlayerName] = useState('');
      const [nameError, setNameError] = useState('');
      const [timeElapsed, setTimeElapsed] = useState(0);
      const [money, setMoney] = useState(0);
      
      const [currentQuest, setCurrentQuest] = useState(null);
      const [completedQuests, setCompletedQuests] = useState([]);
      
      const [inputValue, setInputValue] = useState('');
      
      const [logs, setLogs] = useState([]);
      const [usedTools, setUsedTools] = useState([]);
      const [modal, setModal] = useState(null);
      const [isShopOpen, setIsShopOpen] = useState(false);
      const [purchasedItems, setPurchasedItems] = useState([]);
      
      useEffect(() => {
        let timer;
        if (isPlaying && !modal && !isShopOpen) {
          timer = setInterval(() => setTimeElapsed(prev => prev + 1), 1000);
        }
        return () => clearInterval(timer);
      }, [isPlaying, modal, isShopOpen]);

      const generateNextQuest = useCallback((currentCompleted = completedQuests) => {
        const remainingQuests = QUESTS.filter(q => !currentCompleted.includes(q.id));
        if (remainingQuests.length === 0) return;
        const randomQuest = remainingQuests[Math.floor(Math.random() * remainingQuests.length)];

        setCurrentQuest(randomQuest);
        setInputValue('');
        setUsedTools([]);
        setTimeElapsed(0);
        setLogs([`📢 [새로운 의뢰 도착!]`, randomQuest.dialogue]);
      }, [completedQuests]);

      useEffect(() => {
        if (isPlaying && currentQuest === null && completedQuests.length === 0 && !isShopOpen) {
          generateNextQuest([]);
        }
      }, [isPlaying, currentQuest, completedQuests, isShopOpen, generateNextQuest]);

      const handleToolClick = (toolId) => {
        if (usedTools.includes(toolId)) return;
        playSound('click');

        if (currentQuest.type === 'multi') {
          setLogs(prev => [...prev, `[시스템] 이론 평가 중에는 도구를 사용할 수 없습니다! 머릿속 지식을 활용하세요!`]);
          return;
        }

        const simulatedMineral = MINERALS.find(m => m.id === currentQuest.mineralId);
        let resultMsg = '';
        switch (toolId) {
          case 'color': resultMsg = simulatedMineral.color; break;
          case 'streak': resultMsg = simulatedMineral.streak; break;
          case 'hardness': resultMsg = simulatedMineral.hardness; break;
          case 'hcl': resultMsg = simulatedMineral.hcl; break;
          case 'magnetism': resultMsg = simulatedMineral.magnetism; break;
          default: break;
        }

        setLogs(prev => [...prev, `[${TOOLS.find(t => t.id === toolId).name}] : ${resultMsg}`]);
        setUsedTools(prev => [...prev, toolId]);
      };

      const handleInputSubmit = (e) => {
        e.preventDefault();
        const input = inputValue.replace(/\s+/g, '');
        if (!input) return;

        playSound('click');

        if (currentQuest.type === 'single') {
          if (currentQuest.requiredTool && !usedTools.includes(currentQuest.requiredTool)) {
            playSound('error');
            setLogs(prev => [...prev, `⚠️ [경고] 의뢰인이 먼저 [${TOOLS.find(t=>t.id === currentQuest.requiredTool).name}] 도구를 사용해서 확실하게 구분해주길 원합니다!`]);
            return;
          }

          let isCorrect = false;
          if (currentQuest.target[0] === '흑운모(각·휘·감)') {
            isCorrect = input.includes('흑운모') || input.includes('각섬석') || input.includes('휘석') || input.includes('감람석');
          } else {
            isCorrect = input.includes(currentQuest.target[0]);
          }

          if (isCorrect) {
            handleSuccess(`[${inputValue}] 이(가) 맞습니다!`);
          } else {
            handleFail();
          }
        } else if (currentQuest.type === 'multi') {
          let isAllCorrect = true;
          for (let target of currentQuest.target) {
            if (target === '흑운모(각·휘·감)') {
              if (!(input.includes('흑운모') || input.includes('각섬석') || input.includes('휘석') || input.includes('감람석'))) {
                isAllCorrect = false; break;
              }
            } else {
              if (!input.includes(target)) {
                isAllCorrect = false; break;
              }
            }
          }

          let hasWrong = false;
          ALL_MINERAL_NAMES.forEach(mineral => {
            if (!currentQuest.target.includes(mineral)) {
              if (mineral === '흑운모(각·휘·감)') {
                if (input.includes('흑운모') || input.includes('각섬석') || input.includes('휘석') || input.includes('감람석')) hasWrong = true;
              } else {
                if (input.includes(mineral)) hasWrong = true;
              }
            }
          });

          if (isAllCorrect && !hasWrong) {
            handleSuccess(`모두 정확하게 골라냈습니다! 완벽해요!`);
          } else {
            handleFail(true);
          }
        }
        setInputValue('');
      };

      const handleSuccess = (msg) => {
        playSound('success');
        let speedBonus = 0;
        let timeMsg = `소요 시간: ${timeElapsed}초\n`;
        if (timeElapsed <= 10) {
          speedBonus = 500; timeMsg += `⚡ 스피드 보너스 500G!\n`;
        } else if (timeElapsed <= 20) {
          speedBonus = 200; timeMsg += `🏃 빠른 납품 보너스 200G!\n`;
        }

        setMoney(prev => prev + 1000 + speedBonus);
        const newCompletedQuests = [...completedQuests, currentQuest.id];
        setCompletedQuests(newCompletedQuests);

        if (newCompletedQuests.length >= QUESTS.length) {
          playSound('clear');
          setModal({
            type: 'clear',
            title: '🎓 마스터 감정사 등극!',
            msg: `축하합니다! 도감에 있는 모든 퀘스트를 완벽하게 감정했습니다.\n\n최종 달성 소지금: ${money + 1000 + speedBonus} G\n이제 상점에서 획득한 돈을 써보세요!`,
          });
        } else {
          setModal({
            type: 'success',
            title: '🎉 정답입니다!',
            msg: timeMsg + msg + `\n보수로 ${1000 + speedBonus}G를 받았습니다.`,
            newCompletedQuests 
          });
        }
      };

      const handleFail = (isMulti = false) => {
        playSound('error');
        setMoney(prev => prev - 500);
        setModal({
          type: 'error',
          title: '💥 오답입니다!',
          msg: isMulti 
            ? `입력한 광물 중 틀린 것이 있거나 빼먹은 것이 있습니다!\n위약금 500G를 차감합니다.`
            : `의뢰인이 화를 내며 위약금 500G를 떼어갔습니다...\n일지를 다시 확인해보세요!`,
        });
      };

      const closeModal = () => {
        playSound('click');
        if (modal?.type === 'clear') {
          setIsShopOpen(true);
          setCompletedQuests([]);
          setCurrentQuest(null);
        } else if (modal?.type === 'success') {
          generateNextQuest(modal.newCompletedQuests);
        }
        setModal(null);
      };

      const handleBuyItem = (item) => {
        if (purchasedItems.includes(item.id)) return;
        if (money >= item.price) {
          playSound('success');
          setMoney(prev => prev - item.price);
          setPurchasedItems(prev => [...prev, item.id]);
        } else {
          playSound('error');
        }
      };

      const handleResetConfirm = () => {
        playSound('click');
        setModal({
          type: 'reset',
          title: '🔄 게임 초기화',
          msg: '정말로 처음부터 다시 시작하시겠습니까?\n모든 진행 상황이 삭제됩니다.',
        });
      };

      const handleCapture = () => {
        playSound('click');
        const target = document.getElementById('capture-area');
        if (!target) return;
        
        setTimeout(() => {
          // 배경색이 투명하게 찍히는 것을 방지하기 위해 캡처 옵션에 배경색 지정
          html2canvas(target, { scale: 2, backgroundColor: '#fdf2f8' }).then(canvas => {
            const link = document.createElement('a');
            link.download = `${playerName ? playerName : '무명'}_감정사_업적.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
          });
        }, 100);
      };

      if (!isPlaying) {
        if (showStory) {
          return (
            <div className="min-h-screen bg-gray-900 font-sans p-4 flex flex-col items-center justify-between" style={{ fontFamily: "'Jua', sans-serif" }}>
              <div className="flex-1 flex items-center justify-center w-full">
                <div className="bg-gray-800 rounded-3xl shadow-xl p-10 flex flex-col items-center max-w-md w-full text-center border-4 border-gray-600 animate-fade-in-up">
                  <div className="text-6xl mb-6 drop-shadow-xl">🏚️</div>
                  <h1 className="text-3xl text-yellow-500 mb-6 drop-shadow-sm">할아버지의 낡은 감정소</h1>
                  <p className="text-gray-300 mb-8 text-lg leading-relaxed">
                    "쿨럭... 내 손주야...<br/>이 낡은 광물 감정소를 네게 맡기마.<br/>교과서에서 배운 지식으로 광물을 감정하고<br/>
                    <span className="text-yellow-400 font-bold">{QUESTS.length}개의 퀘스트를 모두 완수해다오...</span>"
                  </p>
                  <button onClick={() => { playSound('click'); setShowStory(false); }} className="bg-yellow-600 hover:bg-yellow-500 text-white text-xl py-3 px-8 rounded-xl shadow-md transition-transform hover:scale-105 active:scale-95 border-b-4 border-yellow-700">
                    상점 물려받기 🔨
                  </button>
                </div>
              </div>
              <AppFooter isDark={true} />
            </div>
          );
        }

        return (
          <div className="min-h-screen bg-pink-50 font-sans p-4 flex flex-col items-center justify-between" style={{ fontFamily: "'Jua', sans-serif" }}>
            <div className="flex-1 flex items-center justify-center w-full">
              <div className="bg-white rounded-3xl shadow-xl p-10 flex flex-col items-center max-w-md w-full text-center border-4 border-pink-200">
                <div className="text-8xl mb-6 animate-float drop-shadow-xl text-gray-300">❓</div>
                <h1 className="text-4xl text-pink-600 mb-4 drop-shadow-sm">💎 광물 판매 타이쿤</h1>
                <p className="text-gray-600 mb-6 text-lg bg-pink-50 p-4 rounded-xl">
                  총 <span className="text-pink-500 font-bold">{QUESTS.length}가지</span>의 퀘스트가 기다립니다.<br/>어떤 광물을 여러 개 적어야 하는<br/>
                  <strong className="text-indigo-500">이론 문제</strong>도 섞여 있으니 주의하세요!
                </p>
                
                <input 
                  type="text" 
                  placeholder="감정사의 이름을 입력하세요" 
                  value={playerName} 
                  onChange={(e) => { setPlayerName(e.target.value); setNameError(''); }}
                  className="mb-2 p-3 w-full rounded-xl border-2 border-pink-300 text-center text-xl focus:outline-none focus:border-pink-500 transition-colors"
                  maxLength={10}
                />
                {nameError && <p className="text-red-500 font-bold mb-4 text-sm">{nameError}</p>}
                {!nameError && <div className="mb-4"></div>}

                <button onClick={() => { 
                  if(!playerName.trim()) {
                    setNameError('이름을 꼭 입력해주세요!');
                    playSound('error');
                    return;
                  }
                  playSound('start'); setIsPlaying(true); setMoney(0); setCompletedQuests([]); setPurchasedItems([]); 
                }} className="bg-pink-400 hover:bg-pink-500 text-white text-2xl py-4 px-10 rounded-full shadow-md transition-transform hover:scale-105 active:scale-95 border-b-4 border-pink-600 w-full">
                  게임 시작하기 🚀
                </button>
              </div>
            </div>
            <AppFooter isDark={false} />
          </div>
        );
      }

      return (
        <div className="min-h-screen bg-pink-50 font-sans p-4 flex flex-col items-center transition-colors duration-500" style={{ fontFamily: "'Jua', sans-serif" }}>
          
          {/* 전체 높이를 잡지 않고, 캡처를 위해 실제 콘텐츠 영역만 감싸는 래퍼 */}
          <div id="capture-area" className="w-full max-w-4xl flex flex-col items-center pb-6">
            <header className="w-full bg-white rounded-3xl shadow-md p-4 mb-6 flex justify-between items-center border-b-4 border-pink-200 flex-wrap gap-2">
              <h1 className="text-2xl md:text-3xl text-pink-600 drop-shadow-sm flex items-center gap-2">
                💎 {playerName}의 타이쿤 {purchasedItems.includes('cloak') && <span className="text-3xl animate-bounce" title="마스터 감정사">👑</span>}
              </h1>
              <div className="flex gap-2 md:gap-3 text-sm md:text-base text-gray-700 flex-wrap items-center">
                <button onClick={handleCapture} className="bg-indigo-100 px-3 py-1 rounded-full border border-indigo-300 text-indigo-700 font-bold hover:bg-indigo-200 active:scale-95 transition-transform shadow-sm">📸 캡처</button>
                <button onClick={handleResetConfirm} className="bg-red-100 px-3 py-1 rounded-full border border-red-300 text-red-700 font-bold hover:bg-red-200 active:scale-95 transition-transform shadow-sm">🔄 처음으로</button>
                <button onClick={() => { playSound('click'); setIsShopOpen(true); }} className="bg-purple-100 px-3 py-1 rounded-full border border-purple-300 text-purple-700 font-bold hover:bg-purple-200 active:scale-95 transition-transform shadow-sm">🛒 상점</button>
                <div className="bg-blue-100 px-3 py-1 rounded-full border border-blue-300 text-blue-700 flex items-center font-bold">⏱️ {timeElapsed}초</div>
                <div className="bg-yellow-100 px-3 py-1 rounded-full border border-yellow-300 font-bold">의뢰: {completedQuests.length + 1} / {QUESTS.length}</div>
                <div className="bg-green-100 px-3 py-1 rounded-full border border-green-300">소금: <span className="text-green-600 font-bold">{money.toLocaleString()} G</span></div>
              </div>
            </header>

            {/* 비율 개선을 위해 max-w-3xl -> max-w-4xl (전체 너비) 사용 */}
            <main className="w-full grid grid-cols-1 md:grid-cols-2 gap-6 relative">
              <section className={`rounded-3xl shadow-lg p-6 border-2 flex flex-col items-center transition-colors duration-500 h-full ${currentQuest?.type === 'multi' ? 'bg-blue-50 border-blue-200' : purchasedItems.includes('showcase') ? 'bg-gradient-to-br from-yellow-300 to-yellow-600 border-yellow-700 shadow-[0_0_20px_rgba(253,224,71,0.6)]' : 'bg-white border-indigo-100'}`}>
                {purchasedItems.includes('microscope') && <div className="absolute -bottom-4 -left-4 text-6xl animate-pulse z-20 drop-shadow-lg" style={{ transform: 'rotate(-15deg)' }}>🔬</div>}
                
                <h2 className={`text-xl mb-4 px-4 py-1 rounded-full w-full text-center z-10 font-bold ${currentQuest?.type === 'multi' ? 'bg-blue-600 text-white shadow-md' : purchasedItems.includes('showcase') ? 'bg-amber-900 text-yellow-300 shadow-md' : 'text-indigo-500 bg-indigo-50'}`}>
                  {currentQuest?.type === 'multi' ? '📘 이론 평가 모드' : '🔬 광물 실험실'}
                </h2>
                <div className="text-8xl my-6 animate-float drop-shadow-xl relative text-gray-300 font-bold z-10">
                  {currentQuest?.type === 'multi' ? '🤔' : '❓'}<div className="absolute -top-4 -right-4 text-3xl animate-pulse">✨</div>
                </div>
                {/* 도구 버튼 비율 개선 */}
                <div className="grid grid-cols-2 gap-3 w-full mt-auto z-10">
                  {TOOLS.map((tool) => (
                    <button key={tool.id} onClick={() => handleToolClick(tool.id)} disabled={usedTools.includes(tool.id) || currentQuest?.type === 'multi'} className={`flex flex-col items-center justify-center p-3 rounded-2xl border-b-4 transition-all duration-200 ${currentQuest?.type === 'multi' ? 'bg-gray-200 text-gray-400 border-gray-300 cursor-not-allowed opacity-50 border-b-0' : usedTools.includes(tool.id) ? 'bg-gray-100 text-gray-400 border-gray-200 cursor-not-allowed transform translate-y-1 border-b-0' : 'bg-indigo-50 text-indigo-700 border-indigo-200 hover:bg-indigo-100 hover:-translate-y-1 active:translate-y-1 active:border-b-0'}`}>
                      <span className="text-lg">{tool.name}</span>
                      <span className="text-xs opacity-70 mt-1 text-center">{tool.desc}</span>
                    </button>
                  ))}
                </div>
              </section>

              <section className="flex flex-col h-full">
                <div className="bg-yellow-50 rounded-3xl shadow-lg p-6 border-2 border-yellow-200 flex-1 flex flex-col h-full">
                  <h2 className="text-xl text-yellow-600 mb-4 bg-yellow-100 px-4 py-1 rounded-full text-center font-bold">📝 실험 일지</h2>
                  <div className="flex-1 bg-white rounded-xl p-4 border border-yellow-100 shadow-inner flex flex-col gap-2 overflow-y-auto min-h-[250px] max-h-[350px]">
                    {logs.map((log, idx) => (
                      <div key={idx} className={`p-3 rounded-lg text-sm animate-fade-in-up leading-relaxed ${log.includes('⚠️') ? 'bg-red-50 text-red-600 font-bold' : 'bg-gray-50 text-gray-700'}`}>
                        {log.split('\n').map((line, i) => <p key={i} className={i === 0 && log.includes('📢') ? 'font-bold text-indigo-600 mb-1 text-base' : ''}>{line}</p>)}
                      </div>
                    ))}
                  </div>
                </div>
              </section>
            </main>

            <section className="w-full mt-6 bg-white rounded-3xl shadow-lg p-6 border-2 border-green-100">
              <h2 className={`text-xl mb-4 px-4 py-2 rounded-full text-center font-bold ${currentQuest?.type === 'multi' ? 'bg-blue-100 text-blue-700' : 'bg-green-50 text-green-600'}`}>
                {currentQuest?.type === 'multi' ? '✅ 해당하는 광물의 이름을 모두 입력하세요 (쉼표/공백 구분)' : '🚚 납품할 광물의 이름을 입력하세요'}
              </h2>
              
              <form onSubmit={handleInputSubmit} className="flex flex-col md:flex-row gap-3">
                <input 
                  type="text" 
                  value={inputValue}
                  onChange={(e) => setInputValue(e.target.value)}
                  placeholder={currentQuest?.type === 'multi' ? "예: 석영, 장석" : "예: 적철석"}
                  className="flex-1 p-4 rounded-2xl border-4 focus:outline-none focus:border-green-400 text-lg md:text-xl font-bold transition-all border-gray-200 text-center md:text-left"
                />
                <button type="submit" className="px-8 py-4 bg-green-500 hover:bg-green-600 text-white text-xl font-bold rounded-2xl shadow-md border-b-4 border-green-700 active:translate-y-1 active:border-b-0 transition-all whitespace-nowrap">
                  제출하기
                </button>
              </form>
            </section>
          </div>

          <AppFooter isDark={false} />

          {/* 모달 및 상점 영역 유지 */}
          {modal && (
            <div className="fixed inset-0 bg-black bg-opacity-40 flex items-center justify-center z-50 animate-fade-in px-4">
              <div className="bg-white rounded-3xl p-8 max-w-sm w-full shadow-2xl flex flex-col items-center text-center transform scale-100 transition-transform">
                <div className="text-6xl mb-4">
                  {modal.type === 'success' ? '🥳' : modal.type === 'clear' ? '🏆' : modal.type === 'reset' ? '⚠️' : '😭'}
                </div>
                <h2 className={`text-2xl mb-4 font-bold ${modal.type === 'error' ? 'text-red-500' : modal.type === 'reset' ? 'text-orange-500' : 'text-green-500'}`}>{modal.title}</h2>
                <p className="text-gray-600 mb-6 whitespace-pre-wrap leading-relaxed font-medium">{modal.msg}</p>
                
                {modal.type === 'reset' ? (
                  <div className="flex gap-4 w-full">
                    <button onClick={() => {
                      setIsPlaying(false); setShowStory(true); setPlayerName(''); setMoney(0); setCompletedQuests([]); setPurchasedItems([]); setCurrentQuest(null); setModal(null);
                    }} className="flex-1 py-3 rounded-2xl text-xl text-white font-bold transition-all hover:scale-105 active:scale-95 shadow-md bg-red-400 hover:bg-red-500">예</button>
                    <button onClick={() => setModal(null)} className="flex-1 py-3 rounded-2xl text-xl text-white font-bold transition-all hover:scale-105 active:scale-95 shadow-md bg-gray-400 hover:bg-gray-500">아니오</button>
                  </div>
                ) : (
                  <button onClick={closeModal} className={`w-full py-3 rounded-2xl text-xl text-white font-bold transition-all hover:scale-105 active:scale-95 shadow-md ${modal.type === 'error' ? 'bg-red-400 hover:bg-red-500' : 'bg-green-400 hover:bg-green-500'}`}>
                    {modal.type === 'success' ? '다음 의뢰 받기 ➡️' : modal.type === 'clear' ? '상점 둘러보기 🛒' : '다시 확인해보기 🔄'}
                  </button>
                )}
              </div>
            </div>
          )}

          {isShopOpen && (
            <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 p-4">
              <div className="bg-white rounded-3xl p-6 md:p-8 max-w-lg w-full shadow-2xl flex flex-col relative max-h-[90vh] overflow-y-auto">
                <button onClick={() => { playSound('click'); setIsShopOpen(false); }} className="absolute top-4 right-4 text-gray-400 hover:text-gray-700 text-3xl font-bold">✕</button>
                <h2 className="text-3xl text-purple-600 mb-2 text-center flex items-center justify-center gap-2">🛒 아이템 상점</h2>
                <p className="text-center text-gray-500 mb-6 font-medium">열심히 번 돈으로 연구실을 꾸미고 희귀 아이템을 모아보세요!</p>
                <div className="bg-green-50 text-green-700 p-3 rounded-xl text-center font-bold text-xl mb-6 border border-green-200 shadow-inner">보유 금액: {money.toLocaleString()} G</div>
                <div className="flex flex-col gap-4">
                  {SHOP_ITEMS.map((item) => {
                    const isPurchased = purchasedItems.includes(item.id);
                    const canAfford = money >= item.price;
                    return (
                      <div key={item.id} className={`flex items-center justify-between p-4 rounded-2xl border-2 transition-all ${isPurchased ? 'bg-gray-100 border-gray-200 opacity-70' : 'bg-white border-purple-100 hover:border-purple-300 hover:shadow-md'}`}>
                        <div className="flex-1">
                          <h3 className={`text-xl font-bold ${isPurchased ? 'text-gray-500' : 'text-gray-800'}`}>{item.name}</h3>
                          <p className="text-sm text-gray-500 mt-1 mr-4">{item.desc}</p>
                        </div>
                        <div className="flex flex-col items-end gap-2 shrink-0">
                          <span className={`font-bold ${isPurchased ? 'text-gray-400 line-through' : 'text-yellow-600'}`}>{item.price.toLocaleString()} G</span>
                          <button onClick={() => handleBuyItem(item)} disabled={isPurchased || (!canAfford && !isPurchased)} className={`px-4 py-2 rounded-xl font-bold transition-all shadow-sm whitespace-nowrap ${isPurchased ? 'bg-gray-300 text-gray-500 cursor-not-allowed' : canAfford ? 'bg-purple-500 hover:bg-purple-600 text-white hover:scale-105 active:scale-95' : 'bg-red-50 text-red-400 border border-red-200 cursor-not-allowed'}`}>
                            {isPurchased ? '구매완료' : '구매하기'}
                          </button>
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Jua&display=swap');
    body { font-family: 'Jua', sans-serif; }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
    .animate-float { animation: float 3s ease-in-out infinite; }
    .animate-fade-in-up { animation: fadeInUp 0.5s ease-out forwards; }
    @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: #fdf2f8; border-radius: 10px; }
    ::-webkit-scrollbar-thumb { background: #fbcfe8; border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: #f472b6; }
  </style>
</body>
</html>
